# 운영 환경에서는 콘솔 OTP 대신 실제 SMTP 발송을 기본으로 사용합니다.
app.auth.otp.delivery=${OTP_DELIVERY:smtp}

# HTTPS 환경에서만 세션 쿠키가 전송되도록 운영 기본값을 강제합니다.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.security.csrf-cookie-secure=${SESSION_COOKIE_SECURE:true}

# Vercel 프론트와 API는 서로 다른 사이트이므로 credential 쿠키 전송에 None이 필요합니다.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
app.security.csrf-cookie-same-site=${SESSION_COOKIE_SAME_SITE:None}
