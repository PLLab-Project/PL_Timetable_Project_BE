# Cloud Run uses the Cloud SQL Java Connector with Application Default Credentials
# from the dedicated runtime service account.
spring.datasource.url=jdbc:postgresql:///${DB_NAME:pl_timetable}
spring.datasource.username=${DB_USER:pl_timetable}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.hikari.data-source-properties.cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
spring.datasource.hikari.data-source-properties.cloudSqlRefreshStrategy=lazy
spring.datasource.hikari.data-source-properties.ipTypes=PUBLIC

server.forward-headers-strategy=framework

app.auth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.ocr.enabled=${OCR_ENABLED:true}
